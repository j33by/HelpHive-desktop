name: HelpHive Admin (Android APK)

on:
  workflow_dispatch:
  push:
    paths: ['admin/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the admin files are all in the repo
        run: |
          missing=0
          for f in package.json capacitor.config.json scripts/build-web.js scripts/patch-android.js renderer/index.html renderer/js/bridge.js renderer/js/app.js assets/icon-only.png assets/icon-foreground.png assets/icon-background.png signing/helphive-debug.keystore; do
            if [ ! -f "$f" ]; then echo "::error::Missing admin/$f. Upload the whole admin folder from admin-folder.zip."; missing=1; fi
          done
          echo "Files in admin/:"; ls -la
          [ -d scripts ] && ls -la scripts
          exit $missing

      - name: Install
        run: npm install

      - name: Build the web bundle
        run: npm run build:web

      - name: Create the Android project
        run: npx cap add android

      - name: Harden the Android project (no screenshots, no cleartext)
        run: node scripts/patch-android.js

      - name: App icons
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Sign with the fixed HelpHive Admin key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.ANDROID_ADMIN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_ADMIN_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Using the keystore from the ANDROID_ADMIN_KEYSTORE_BASE64 secret"
          else
            cp signing/helphive-debug.keystore ~/.android/debug.keystore
            echo "Using admin/signing/helphive-debug.keystore from the repo"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2

      - name: Build the APK
        working-directory: admin/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HelpHive-Admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helphive-admin-android
          path: admin/HelpHive-Admin.apk

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/HelpHive-Admin.apk
