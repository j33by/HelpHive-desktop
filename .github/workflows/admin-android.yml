name: HelpHive Admin (Android APK)

on:
  workflow_dispatch:
  push:
    paths: ['admin/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Build the web bundle
        run: npm run build:web

      - name: Create the Android project
        run: npx cap add android

      - name: Harden the Android project (no screenshots, no cleartext)
        run: node scripts/patch-android.js

      - name: App icons
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build the APK
        working-directory: admin/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HelpHive-Admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helphive-admin-android
          path: admin/HelpHive-Admin.apk

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/HelpHive-Admin.apk
