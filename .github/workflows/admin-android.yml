name: HelpHive Admin (Android APK)

on:
  workflow_dispatch:
  push:
    paths: ['admin/**']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-debug.apk HelpHive-Admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helphive-admin-android
          path: admin/HelpHive-Admin.apk

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/HelpHive-Admin.apk
