
name: HelpHive desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/desktop.yml']

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-latest,   platform: macos }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned: the newest stable (3.44+) crashes the macOS release build
      # (flutter/flutter#191575, "Class with illegal cid" in _window_macos.dart).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Create the ${{ matrix.platform }} project and patch it
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then
            cp -r lib "$RUNNER_TEMP/hh_lib" && cp pubspec.yaml "$RUNNER_TEMP/hh_pubspec.yaml"
            flutter create --platforms=${{ matrix.platform }} --org io.helphive --project-name helphive .
            rm -rf lib && cp -r "$RUNNER_TEMP/hh_lib" lib && cp "$RUNNER_TEMP/hh_pubspec.yaml" pubspec.yaml
            rm -f test/widget_test.dart
          fi
          python tool/patch_desktop.py ${{ matrix.platform }}

      - run: flutter pub get

      # Windows and macOS icons come from assets/icons/launcher.png. This uses its
      # own config file, so the Android build (Codemagic) is not affected.
      - name: App icon (Windows)
        if: matrix.platform == 'windows'
        run: |
          cat > icons_desktop.yaml <<EOF
          flutter_launcher_icons:
            image_path: "assets/icons/launcher.png"
            windows:
              generate: true
              image_path: "assets/icons/launcher.png"
              icon_size: 256
          EOF
          dart run flutter_launcher_icons -f icons_desktop.yaml

      - name: App icon (macOS)
        if: matrix.platform == 'macos'
        run: |
          cat > icons_desktop.yaml <<EOF
          flutter_launcher_icons:
            image_path: "assets/icons/launcher.png"
            macos:
              generate: true
              image_path: "assets/icons/launcher.png"
          EOF
          dart run flutter_launcher_icons -f icons_desktop.yaml

      - name: Static check
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release
        run: |
          flutter build ${{ matrix.platform }} --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_URL=${{ secrets.API_URL }}

      - name: Zip (Linux)
        if: matrix.platform == 'linux'
        run: cd build/linux/x64/release && zip -qr "$GITHUB_WORKSPACE/HelpHive-linux.zip" bundle

      - name: Zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE/HelpHive-windows.zip"

      - name: Zip (macOS)
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/HelpHive.app "$GITHUB_WORKSPACE/HelpHive-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HelpHive-${{ matrix.platform }}
          path: HelpHive-${{ matrix.platform }}.zip
